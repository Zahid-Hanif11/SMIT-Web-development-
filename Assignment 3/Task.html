<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
</head>

<body>
    <table align="center" cellpadding="10" cellspacing="0">
        <tr >
            <th colspan="2"><b>Job Details:</b></th>
        </tr>
        <tr>
            <td>
                Job title:
            </td>
            <td>
                <form>
                    <input type="text" name="Job title" required>
                </form>
                
            </td>
        </tr>
        <tr>
            <td>
                Description:
            </td>
            <td>
                <form>
                    <textarea name="Description" rows="6" cols="30" required></textarea>
                </form>
                
            </td>
        </tr>
        <tr>
            <td>
            </td>
            <td>
                Brief Description Had almost 500 Characters.
            </td>
        </tr>
    </table>
</body>

</html>
