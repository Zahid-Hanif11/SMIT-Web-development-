<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link rel="stylesheet" href="Style.css">
</head>
<body>

    <div class="form-container">
        <span class="close-btn">&times;</span>
        
        <h2><span class="dot">&middot;</span> Registration Form <span class="dot">&middot;</span></h2>
        
        <form action="#">
            <div class="input-group">
                <span class="asterisk">*</span>
                <input type="text" placeholder="Name" required>
            </div>
            
            <div class="input-group">
                <span class="asterisk">*</span>
                <input type="email" placeholder="Email address" required>
            </div>
            
            <div class="input-group">
                <input type="text" placeholder="Country" class="no-asterisk">
            </div>
            
            <div class="input-group">
                <span class="asterisk">*</span>
                <input type="tel" placeholder="Phone" required>
            </div>
            
            <div class="input-group password-group">
                <span class="asterisk">*</span>
                <input type="password" placeholder="Password" required>
                <span class="eye-icon">
                    <svg viewBox="0 0 24 24" width="16" height="16" fill="#0264f6"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                </span>
            </div>
            
            <div class="checkbox-group">
                <input type="checkbox" id="terms" required>
                <label for="terms">Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat</label>
            </div>
            
            <button type="submit" class="submit-btn">CREATE ACCOUNT</button>
            
            <p class="signin-text">Already have an account? <a href="#">Sign in</a></p>
        </form>
    </div>
    
    <div class="watermark">
        designed by <strong>freepik</strong>
    </div>

</body>
</html>
