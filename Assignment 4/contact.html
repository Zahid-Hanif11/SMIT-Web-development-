    <main>
        <h1>CONTACT US</h1>
        
        <p>Call us directly at: <a href="tel:+923001886453">+92 300 1886453</a></p>
        <p>Email us at: <a href="mailto:zahidhanif017@gmail.com">zahidhanif017@gmail.com</a></p>
        <br>

        <form action="#" method="POST">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="subject">Subject:</label><br>
            <input type="text" id="subject" name="subject"><br><br>

            <label for="gender">Gender:</label><br>
            <select id="gender" name="gender">
                <option value="male">Male</option>
                <option value="female">Female</option>
                <option value="other">Other</option>
            </select><br><br>

            <label>Food Preference:</label><br>
            <input type="radio" id="veg" name="food_preference" value="Vegetarian">
            <label for="veg">Vegetarian</label><br>
            <input type="radio" id="nonveg" name="food_preference" value="Non-Vegetarian">
            <label for="nonveg">Non-Vegetarian</label><br><br>

            <label for="message">Message:</label><br>
            <textarea id="message" name="message" rows="5" cols="30" required></textarea><br><br>

            <button type="submit">Submit</button>
        </form>

        <br><br>
